
<button id="pato">🦆</button>

<p id="contador">0</p>

<video id="video67" src="67.mp4" 
       style="display:none; width:100%; max-width:800px"
       controls playsinline></video>

<audio id="quack" src="quack.mp3" preload="auto"></audio>

<script>
let clicks = 0;

const pato = document.getElementById("pato");
const contador = document.getElementById("contador");
const video = document.getElementById("video67");
const quack = document.getElementById("quack");

pato.addEventListener("click", async () => {
    clicks++;
    contador.textContent = clicks;

    if (clicks === 67) {
        pato.style.display = "none";
        contador.style.display = "none";
        video.style.display = "block";

        try {
            await video.play();
        } catch (e) {
            video.controls = true;
        }

        return;
    }

    quack.currentTime = 0;
    quack.play();
});
</script>
